[project]
name = "borrowed-hands"
version = "0.1.0"
description = "Claude borrows your hands to use websites that block bots"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8",
]

[project.scripts]
hands = "borrowed_hands.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-qt>=4.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
